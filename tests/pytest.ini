# Lives in tests/ (not the repo root) on purpose: the pack root must be a
# Python package for ComfyUI, and a rootdir with an __init__.py makes
# pytest try to import it — which fails, since its directory name isn't a
# valid module name. With the rootdir here, the pack is only imported by
# the `pack` fixture in conftest.py, the way ComfyUI imports it.
[pytest]
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
